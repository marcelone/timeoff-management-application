# =====================================================================
# DISABLED (Phase 2 / Pas 0): automatic push triggers removed.
# Previously deployed to GKE and ran `terraform apply -auto-approve` on push
# to ANY branch. Now MANUAL-ONLY (workflow_dispatch). Target: Coolify (Docker).
# Re-enable only after explicit review. No automatic runs on push.
# =====================================================================
# These workflows deployed to GKE and ran `terraform apply -auto-approve`.
# They are now MANUAL-ONLY (workflow_dispatch) and must not run automatically.
name: DEPLOY_Infrastructure

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download code 
        uses: actions/checkout@v3

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GOOGLE_CREDENTIALS }}'
          token_format: 'access_token'
      
      - name: Configure terraform 
        uses: hashicorp/setup-terraform@v2

      - name: Init terraform modules
        run: terraform init
        working-directory: infrastructure

      - name: Execute a plan for terraform
        run: terraform plan
        working-directory: infrastructure

      - name: Apply terraform manifests
        run: terraform apply -auto-approve
        working-directory: infrastructure
      