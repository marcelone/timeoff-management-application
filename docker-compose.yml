# TimeOff HR platform — reproducible deployment (Coolify-ready).
#
# Default: single container + SQLite on a persistent volume.
# PostgreSQL (preferred for production):
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build
#   (sets DB_DIALECT=postgres, adds a healthy db service and startup ordering).

services:
  app:
    build: .
    image: timeoff-hr:latest
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET in .env}"
      DB_DIALECT: "${DB_DIALECT:-sqlite}"
      DB_STORAGE: /app/data/timeoff.sqlite
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-timeoff}"
      DB_USER: "${DB_USER:-timeoff}"
      DB_PASSWORD: "${DB_PASSWORD:-timeoff}"
      DB_SSL: "${DB_SSL:-false}"
      TRUST_PROXY: "true"
      SEND_EMAILS: "${SEND_EMAILS:-false}"
      SMTP_HOST: "${SMTP_HOST:-localhost}"
      SMTP_PORT: "${SMTP_PORT:-25}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      APPLICATION_DOMAIN: "${APPLICATION_DOMAIN:-http://localhost:3000}"
      ALLOW_CREATE_NEW_ACCOUNTS: "${ALLOW_CREATE_NEW_ACCOUNTS:-true}"
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
